<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOON-KV - Monitor</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🌙 MOON-KV Dashboard</h1>
            <div class="header-info">
                <span id="version">Version: 1.0.0</span>
                <span id="uptime">Uptime: --</span>
            </div>
        </header>

        <nav class="nav">
            <a href="/" class="nav-link">Dashboard</a>
            <a href="/data.html" class="nav-link">Data Management</a>
            <a href="/monitor.html" class="nav-link active">Monitor</a>
            <a href="/config.html" class="nav-link">Config</a>
        </nav>

        <main class="main">
            <section class="monitor-section">
                <h2>System Monitor</h2>

                <div class="monitor-grid">
                    <div class="monitor-card">
                        <h3>Memory Statistics</h3>
                        <div id="memoryStats" class="monitor-content">
                            Loading...
                        </div>
                    </div>

                    <div class="monitor-card">
                        <h3>JVM Memory</h3>
                        <div id="jvmStats" class="monitor-content">
                            Loading...
                        </div>
                    </div>

                    <div class="monitor-card">
                        <h3>System Status</h3>
                        <div id="systemStatus" class="monitor-content">
                            Loading...
                        </div>
                    </div>

                    <div class="monitor-card">
                        <h3>Health Status</h3>
                        <div id="healthStatus" class="monitor-content">
                            Loading...
                        </div>
                    </div>
                </div>

                <div class="monitor-controls">
                    <button onclick="loadMonitorData()" class="btn btn-primary">Refresh Now</button>
                    <label>
                        <input type="checkbox" id="autoRefresh" checked onchange="toggleAutoRefresh()">
                        Auto Refresh (5s)
                    </label>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>MOON-KV &copy; 2024 - Lightweight KV Database with WAL and TTL Support</p>
        </footer>
    </div>

    <script src="/js/api.js"></script>
    <script>
        let autoRefreshInterval;

        async function loadMonitorData() {
            try {
                await Promise.all([
                    loadMemoryStats(),
                    loadJvmStats(),
                    loadSystemStatus(),
                    loadHealthStatus()
                ]);
            } catch (error) {
                console.error('Failed to load monitor data:', error);
            }
        }

        async function loadMemoryStats() {
            try {
                const response = await api.getMemoryStats();
                const div = document.getElementById('memoryStats');

                if (response.code === 200) {
                    const data = response.data;
                    div.innerHTML = `
                        <div class="stat-row">
                            <span>Entry Count:</span>
                            <span>${data.entryCount || 0}</span>
                        </div>
                        <div class="stat-row">
                            <span>Used Bytes:</span>
                            <span>${formatBytes(data.usedBytes || 0)}</span>
                        </div>
                        <div class="stat-row">
                            <span>Max Bytes:</span>
                            <span>${formatBytes(data.maxBytes || 0)}</span>
                        </div>
                        <div class="stat-row">
                            <span>Usage Ratio:</span>
                            <span>${((data.usageRatio || 0) * 100).toFixed(2)}%</span>
                        </div>
                    `;
                } else {
                    div.innerHTML = '<p class="error">Failed to load memory stats</p>';
                }
            } catch (error) {
                document.getElementById('memoryStats').innerHTML = '<p class="error">Error loading data</p>';
            }
        }

        async function loadJvmStats() {
            try {
                const response = await api.getStats();
                const div = document.getElementById('jvmStats');

                if (response.code === 200 && response.data.jvm) {
                    const jvm = response.data.jvm;
                    div.innerHTML = `
                        <div class="stat-row">
                            <span>Used Memory:</span>
                            <span>${formatBytes(jvm.usedMemory)}</span>
                        </div>
                        <div class="stat-row">
                            <span>Free Memory:</span>
                            <span>${formatBytes(jvm.freeMemory)}</span>
                        </div>
                        <div class="stat-row">
                            <span>Total Memory:</span>
                            <span>${formatBytes(jvm.totalMemory)}</span>
                        </div>
                        <div class="stat-row">
                            <span>Max Memory:</span>
                            <span>${formatBytes(jvm.maxMemory)}</span>
                        </div>
                    `;
                } else {
                    div.innerHTML = '<p class="error">Failed to load JVM stats</p>';
                }
            } catch (error) {
                document.getElementById('jvmStats').innerHTML = '<p class="error">Error loading data</p>';
            }
        }

        async function loadSystemStatus() {
            try {
                const response = await api.getStats();
                const div = document.getElementById('systemStatus');

                if (response.code === 200) {
                    const data = response.data;
                    document.getElementById('uptime').textContent = 'Uptime: ' + formatUptime(data.uptime);
                    
                    div.innerHTML = `
                        <div class="stat-row">
                            <span>Key Count:</span>
                            <span>${data.keyCount || 0}</span>
                        </div>
                        <div class="stat-row">
                            <span>Memory Usage:</span>
                            <span>${formatBytes(data.memoryUsage || 0)}</span>
                        </div>
                        <div class="stat-row">
                            <span>Usage Ratio:</span>
                            <span>${((data.usageRatio || 0) * 100).toFixed(2)}%</span>
                        </div>
                    `;
                } else {
                    div.innerHTML = '<p class="error">Failed to load system status</p>';
                }
            } catch (error) {
                document.getElementById('systemStatus').innerHTML = '<p class="error">Error loading data</p>';
            }
        }

        async function loadHealthStatus() {
            try {
                const response = await api.getHealth();
                const div = document.getElementById('healthStatus');

                if (response.code === 200) {
                    const data = response.data;
                    document.getElementById('version').textContent = 'Version: ' + data.version;
                    
                    let html = `<div class="stat-row"><span>Status:</span><span class="status-${data.status.toLowerCase()}">${data.status}</span></div>`;
                    
                    if (data.components) {
                        for (const [name, component] of Object.entries(data.components)) {
                            html += `
                                <div class="stat-row">
                                    <span>${name}:</span>
                                    <span class="status-${component.status.toLowerCase()}">${component.status}</span>
                                </div>
                            `;
                        }
                    }
                    
                    div.innerHTML = html;
                } else {
                    div.innerHTML = '<p class="error">Failed to load health status</p>';
                }
            } catch (error) {
                document.getElementById('healthStatus').innerHTML = '<p class="error">Error loading data</p>';
            }
        }

        function toggleAutoRefresh() {
            const checkbox = document.getElementById('autoRefresh');
            
            if (checkbox.checked) {
                autoRefreshInterval = setInterval(loadMonitorData, 5000);
            } else {
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadMonitorData();
            toggleAutoRefresh();
        });

        window.addEventListener('beforeunload', function() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
        });
    </script>

    <style>
        .monitor-section {
            margin-bottom: 30px;
        }

        .monitor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .monitor-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #e9ecef;
        }

        .monitor-card h3 {
            margin-bottom: 15px;
            color: #667eea;
            font-size: 18px;
        }

        .monitor-content {
            min-height: 100px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-row span:first-child {
            font-weight: 500;
            color: #666;
        }

        .stat-row span:last-child {
            font-weight: 600;
            color: #333;
        }

        .status-up {
            color: #28a745;
            font-weight: bold;
        }

        .status-down {
            color: #dc3545;
            font-weight: bold;
        }

        .status-warning {
            color: #ffc107;
            font-weight: bold;
        }

        .monitor-controls {
            display: flex;
            gap: 20px;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .monitor-controls label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .monitor-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</body>
</html>
